<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            background-color: black;
            color: white;
            font-size: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            

        }
        .container{
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(3,100px);
            grid-template-rows: repeat(3,100px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>
</body>
</html>
